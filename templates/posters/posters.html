<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Poster designs</title>
<!-- Poster-style designs for client social posts and feature art. Each poster
     is 1080 x 1350 (4:5, Instagram portrait). Render to PNG with
     node scripts/render-posters.mjs. Flat colour, big type, print grain. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Archivo:wght@300;500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #e9e6df; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
  /* Print grain over every poster */
  .poster::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .32;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .tag { position: absolute; font: 500 22px/1 Archivo, sans-serif; letter-spacing: .02em; }

  /* 1. Little Tern Coffee: harbour navy, cream serif letters around the beans */
  .tern { background: #1d2c6e; color: #f6e7b4; }
  .tern .word { position: absolute; font: 400 430px/.78 "DM Serif Display", serif; letter-spacing: -.04em; }
  .tern .w1 { left: -40px; top: 150px; }
  .tern .w2 { left: 300px; top: 470px; }
  .tern .w3 { left: -30px; top: 800px; }
  .tern .bean { position: absolute; width: 230px; height: 320px; border-radius: 50%; background: #c8452f; }
  .tern .bean::after { content: ""; position: absolute; left: 50%; top: 12%; width: 40px; height: 76%; margin-left: -20px; border-left: 14px solid #8f2b1d; border-radius: 50%; }
  .tern .b1 { left: 610px; top: 150px; transform: rotate(28deg); }
  .tern .b2 { left: 120px; top: 520px; transform: rotate(-22deg); }
  .tern .t1 { right: 60px; top: 60px; font-size: 40px; font-weight: 500; }
  .tern .t2 { left: 60px; bottom: 60px; font-size: 40px; font-weight: 500; }

  /* 2. Kerr & Sons: blue halftone photo, huge tilted pink type */
  .kerr { background: #eeeee6; }
  .kerr .photo { position: absolute; left: 70px; right: 70px; top: 110px; height: 760px; overflow: hidden; background: #fff; }
  .kerr .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.5) brightness(1.05); mix-blend-mode: multiply; }
  .kerr .photo::before { content: ""; position: absolute; inset: 0; z-index: 1; background: #2a4ea8; mix-blend-mode: screen; }
  .kerr .photo::after { content: ""; position: absolute; inset: 0; z-index: 2; mix-blend-mode: screen; background: radial-gradient(circle, transparent 38%, #eeeee6 40%) 0 0 / 7px 7px; opacity: .55; }
  .kerr .big { position: absolute; left: -40px; right: -40px; top: 860px; white-space: nowrap; font: 400 330px/.8 Anton, sans-serif; color: #e2457f; text-align: center; transform: rotate(-7deg); letter-spacing: -.01em; }
  .kerr .dot { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: #2a4ea8; }
  .kerr .tag { color: #2a4ea8; font-weight: 500; }
  .kerr .t1 { left: 130px; top: 56px; }
  .kerr .t1::before { content: ""; display: inline-block; width: 120px; height: 2px; margin-right: 18px; vertical-align: middle; background: #2a4ea8; }
  .kerr .t2 { right: 70px; bottom: 60px; }

  /* 3. Wattle & Fern: butter ground, orange blob flowers, aubergine lettering */
  .fern { background: #f0dcb4; color: #3b1d3f; }
  .fern .flower { position: absolute; width: 360px; height: 360px; }
  .fern .flower i { position: absolute; width: 58%; height: 58%; border-radius: 50%; background: #d8683b; }
  .fern .flower i:nth-child(1) { left: 0; top: 18%; } .fern .flower i:nth-child(2) { left: 21%; top: 0; }
  .fern .flower i:nth-child(3) { left: 42%; top: 18%; } .fern .flower i:nth-child(4) { left: 32%; top: 42%; }
  .fern .flower i:nth-child(5) { left: 10%; top: 42%; }
  .fern .f1 { left: 330px; top: 60px; } .fern .f2 { left: 30px; top: 560px; } .fern .f3 { left: 560px; top: 520px; width: 420px; height: 420px; }
  .fern .stems { position: absolute; inset: 0; }
  .fern .word { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font: 800 260px/1 "Bricolage Grotesque", sans-serif; font-style: italic; letter-spacing: -.06em; transform: skewX(-6deg); }
  .fern .corner1 { position: absolute; left: -90px; top: -90px; width: 260px; height: 260px; border-radius: 50%; background: #3b1d3f; }
  .fern .bars { position: absolute; right: 70px; top: 60px; display: flex; gap: 16px; }
  .fern .bars i { width: 20px; height: 110px; background: #3b1d3f; }
  .fern .half { position: absolute; right: 0; bottom: 0; width: 320px; height: 160px; border-radius: 160px 160px 0 0; background: #3b1d3f; }
  .fern .tag { left: 60px; bottom: 60px; color: #3b1d3f; font-size: 26px; }

  /* 4. Saltwater Yoga: deep sea green, a cream sun rising out of waves */
  .salt { background: #1f5b57; color: #f4ead7; }
  .salt .title { position: absolute; left: 70px; top: 80px; font: 300 168px/.92 Archivo, sans-serif; letter-spacing: -.045em; }
  .salt .sun { position: absolute; left: 290px; top: 640px; width: 600px; height: 600px; border-radius: 50%; background: #f0b45c; }
  .salt .wave { position: absolute; left: -60px; right: -60px; height: 220px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .salt .wv1 { top: 930px; background: #f4ead7; }
  .salt .wv2 { top: 1040px; background: #2f7d78; left: -200px; }
  .salt .wv3 { top: 1150px; background: #f4ead7; right: -240px; }
  .salt .side { position: absolute; left: 70px; bottom: 56px; z-index: 1; color: #1f5b57; font: 500 30px/1 Archivo, sans-serif; letter-spacing: .01em; }
  .salt .tag { right: 70px; top: 96px; text-align: right; line-height: 1.35; }
</style>
</head>
<body>

<div class="poster tern" id="little-tern-coffee">
  <span class="tag t1">Open from 6am</span>
  <div class="bean b1"></div>
  <div class="bean b2"></div>
  <span class="word w1">fla</span>
  <span class="word w2">t wh</span>
  <span class="word w3">ite</span>
  <span class="tag t2">Little Tern, Fremantle</span>
</div>

<div class="poster kerr" id="kerr-and-sons">
  <span class="dot" style="left:60px;top:44px"></span><span class="dot" style="right:60px;top:44px"></span>
  <span class="tag t1">Kerr &amp; Sons Electrical, Newcastle</span>
  <div class="photo"><img src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=1400&q=80&auto=format&fit=crop" alt=""></div>
  <div class="big">ON TIME</div>
  <span class="dot" style="left:60px;bottom:50px"></span>
  <span class="tag t2">Licensed sparkies. Fixed prices.</span>
</div>

<div class="poster fern" id="wattle-and-fern">
  <div class="corner1"></div>
  <div class="bars"><i></i><i></i><i></i><i></i></div>
  <svg class="stems" viewBox="0 0 1080 1350" aria-hidden="true">
    <path d="M520 330 C 560 700, 470 900, 540 1350" stroke="#3b1d3f" stroke-width="16" fill="none"/>
    <path d="M210 800 C 330 950, 430 1050, 470 1350" stroke="#3b1d3f" stroke-width="16" fill="none"/>
    <path d="M770 820 C 690 1000, 620 1120, 600 1350" stroke="#3b1d3f" stroke-width="16" fill="none"/>
    <path d="M540 980 C 640 900, 720 930, 760 1000 C 680 1040, 600 1030, 540 980 Z" fill="#3b1d3f"/>
    <path d="M500 1120 C 400 1040, 320 1070, 290 1140 C 370 1170, 450 1160, 500 1120 Z" fill="#3b1d3f"/>
  </svg>
  <div class="flower f1"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="flower f2"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="flower f3"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="word">bloom</div>
  <div class="half"></div>
  <span class="tag">Wattle &amp; Fern, Hobart</span>
</div>

<div class="poster salt" id="saltwater-yoga">
  <div class="title">Sunrise<br>flow</div>
  <span class="tag">Saturdays, 7am<br>on the sand</span>
  <span class="side">Saltwater Yoga, Cronulla</span>
  <div class="sun"></div>
  <div class="wave wv1"></div>
  <div class="wave wv2"></div>
  <div class="wave wv3"></div>
</div>

</body>
</html>
